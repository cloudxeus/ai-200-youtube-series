apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai200foundrychat
spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai200foundrychat

  template:
    metadata:
      labels:
        app: ai200foundrychat

    spec:
      containers:
        - name: ai200foundrychat

          image: regdeveus200.azurecr.io/ai200foundrychat:v1

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"